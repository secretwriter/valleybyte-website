<style>
:root{--bg:#070b12;--bg2:#0b111a;--surface:#0d141e;--line:#1b2633;--text:#eef4f8;--muted:#8b9aaa;--dim:#526171;--cyan:#22d3ee;--cyan2:#06b6d4;--danger:#fb7185;--amber:#fbbf24;--max:1120px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{width:min(var(--max),calc(100% - 40px));margin:auto}.border{border-bottom:1px solid var(--line)}.alt{background:var(--bg2)}
header{position:sticky;top:0;z-index:50;background:rgba(7,11,18,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:9px;align-items:center;font-weight:700;font-size:19px}.brand b{font-family:monospace;color:var(--cyan);font-size:17px}
.navlinks{display:flex;gap:3px}.navlinks a{padding:9px 11px;border-radius:7px;color:var(--muted);font-size:14px}.navlinks a:hover,.navlinks a.active{color:var(--text);background:#ffffff06}
.actions{display:flex;gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;padding:10px 15px;border:1px solid var(--line);font-size:14px;font-weight:650;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--cyan);border-color:var(--cyan);color:#031016}.secondary{background:#ffffff03;color:var(--text)}
.mobile{display:none;background:none;border:0;color:var(--text);font-size:24px}.mobile-menu{display:none;padding:10px 0 18px}.mobile-menu a{display:block;padding:12px 4px;color:var(--muted);border-bottom:1px solid #ffffff0a}
section{border-bottom:1px solid var(--line)}.pad{padding:82px 0}.hero{min-height:650px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.eyebrow{font-family:monospace;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--cyan)}h1{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.045em;margin:15px 0 22px}h2{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.03em;margin:7px 0 13px}h3{margin:0}.lead{font-size:17px;color:var(--muted);max-width:650px}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.hero-image{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0b1119;box-shadow:0 30px 100px #0008}.hero-image img{display:block;width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.grid2form{display:grid;grid-template-columns:1fr 1.25fr;gap:55px}
.kicker{color:var(--muted);font-size:15px;max-width:650px}.surface{background:var(--surface);border:1px solid var(--line);border-radius:12px}.card{padding:23px}.card .icon{color:var(--cyan);font-size:22px;margin-bottom:15px}.card p,.body{color:var(--muted);font-size:14px}.feature-grid{margin-top:40px}.feature-card{min-height:180px}.number{font-family:monospace;color:var(--dim);font-size:12px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.tag{display:inline-block;border:1px solid var(--line);background:#ffffff03;color:#b7c3cf;border-radius:999px;padding:5px 10px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.stat{padding:15px}.stat small{display:block;color:var(--dim);font-size:11px}.stat strong{display:block;margin-top:3px;font-size:14px}.list{display:grid;gap:9px}.list-item{display:flex;gap:11px;align-items:center;padding:12px 14px}.check{color:var(--cyan);font-weight:800}
.timeline{display:grid;gap:12px;margin-top:35px}.week{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:20px}.weekno{font-family:monospace;color:var(--cyan);font-size:13px}.week ul{margin:9px 0 0;padding-left:18px;color:var(--muted);font-size:14px}.week li{margin:4px 0}
.cta{padding:70px 0}.cta-box{padding:38px;display:flex;align-items:center;justify-content:space-between;gap:25px}
.notice{display:flex;gap:13px;padding:18px;border:1px solid #fbbf2425;background:#fbbf2408;border-radius:10px;color:var(--muted);font-size:14px}.notice b{color:var(--text)}
form{padding:25px}.field{margin-bottom:17px}.field label{display:block;font-size:12px;color:#b8c3ce;margin-bottom:7px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:#080e16;border:1px solid var(--line);border-radius:7px;color:var(--text);outline:none}.field textarea{resize:vertical;min-height:110px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#22d3ee66;box-shadow:0 0 0 3px #22d3ee0b}.error{color:var(--danger);font-size:12px;margin-top:5px}.success{text-align:center;padding:45px 25px}.success .big{font-size:38px;color:var(--cyan)}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--dim)}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.filebox{border:1px dashed var(--line);padding:14px;border-radius:8px;color:var(--muted);cursor:pointer}.filebox:hover{border-color:#22d3ee66}
.faq{border:1px solid var(--line);border-radius:10px;overflow:hidden}.faq-item+ .faq-item{border-top:1px solid var(--line)}.faq-q{width:100%;padding:17px;background:none;border:0;color:var(--text);display:flex;justify-content:space-between;text-align:left;font-weight:650}.faq-a{display:none;padding:0 17px 18px;color:var(--muted);font-size:14px}.faq-item.open .faq-a{display:block}.faq-item.open .plus{transform:rotate(45deg)}.plus{transition:.2s;font-size:20px;color:var(--dim)}
.cert{padding:28px;background:linear-gradient(135deg,#0d1722,#091018);border:1px solid #244052;border-radius:13px}.cert .seal{font-family:monospace;color:var(--cyan);font-size:11px;letter-spacing:.12em}.cert h3{font-size:25px;margin:15px 0 5px}.cert .line{height:1px;background:var(--line);margin:22px 0}.cert-meta{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cert-meta small{display:block;color:var(--dim);font-size:10px}.cert-meta span{font-size:13px;color:#c6d0d9}.status-valid{color:#67e8f9!important}.status-revoked{color:var(--danger)!important}
.page-head{padding:75px 0 55px}.page-head p{max-width:650px;color:var(--muted)}
footer{padding:45px 0;color:var(--dim);font-size:13px}.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:30px}.footer-links{display:grid;gap:8px}.footer-links a:hover{color:var(--text)}
.hidden{display:none!important}
@media(max-width:950px){.navlinks,.actions{display:none}.mobile{display:block}.mobile-menu.show{display:block}.hero{grid-template-columns:1fr;padding:55px 0}.grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.grid2,.grid2form{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.container{width:min(100% - 28px,var(--max))}.pad{padding:58px 0}.grid3,.grid4,.stat-grid,.two-fields{grid-template-columns:1fr}h1{font-size:44px}.cta-box{display:block}.cta-box .actions{display:flex;margin-top:20px}.week{grid-template-columns:1fr;gap:5px}.cert-meta{grid-template-columns:1fr}.hero{min-height:auto}}
</style>

// Google Apps Script Web App endpoint. Applications and contact messages
// are POSTed here as multipart form data; a "formType" field tells the
// script which sheet/tab to log the row to. The /exec endpoint doesn't
// send back CORS headers, so the request is made with mode:"no-cors" -
// the browser can't read the response body or status, only whether the
// request itself failed outright (e.g. no network). That matches how a
// plain HTML form POST to Apps Script behaves, so "didn't throw" = sent.
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbztEnIfTaB81lbfLCQTqfNh_grZvX0bDSWkaoY140CClR2nOlf9eGVUSLQIwVmGWYog/exec";

async function submitApplication(e){
e.preventDefault();let vals={fullName:fullName.value.trim(),email:email.value.trim(),phone:phone.value.trim(),college:college.value.trim(),degree:degree.value.trim(),graduationYear:graduationYear.value.trim(),skillLevel:skillLevel.value,motivation:motivation.value.trim()};
let errors=[];
if(!vals.fullName)errors.push("Full name is required.");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email))errors.push("Enter a valid email.");if(!vals.phone)errors.push("Phone number is required.");if(!vals.college)errors.push("College or university is required.");if(!vals.degree)errors.push("Degree is required.");if(!/^\d{4}$/.test(vals.graduationYear))errors.push("Enter a valid 4-digit graduation year.");if(!vals.skillLevel)errors.push("Please select your current skill level.");if(vals.motivation.length<20)errors.push("Please share at least a couple of sentences.");
let file=cvFile.files[0];if(file&&!["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"].includes(file.type)&&!/\.(pdf|doc|docx)$/i.test(file.name))errors.push("CV must be a PDF, DOC, or DOCX file.");
if(errors.length){appErrors.innerHTML=errors.map(x=>err("",x)).join("");return}
let ref=`VB-APP-${new Date().getFullYear()}-${Math.floor(100000+Math.random()*900000)}`;
const submitBtn=e.target.querySelector('button[type="submit"]');const originalLabel=submitBtn.textContent;
submitBtn.disabled=true;submitBtn.textContent="Submitting...";appErrors.innerHTML="";
try{
const fd=new FormData();
fd.append("formType","application");
fd.append("referenceId",ref);
fd.append("fullName",vals.fullName);
fd.append("email",vals.email);
fd.append("phone",vals.phone);
fd.append("college",vals.college);
fd.append("degree",vals.degree);
fd.append("graduationYear",vals.graduationYear);
fd.append("skillLevel",vals.skillLevel);
fd.append("motivation",vals.motivation);
fd.append("cvFileName",file?file.name:"");
fd.append("submittedAt",new Date().toISOString());
// NOTE: only the CV's file name is sent, not its contents. Actually
// uploading the file to Drive needs the Apps Script's doPost(e) to read
// a blob from e.parameter.cvFile and save it - ask if you'd like that
// wired up once the script side supports it.
await fetch(APPS_SCRIPT_URL,{method:"POST",body:fd,mode:"no-cors"});
document.getElementById("applicationBox").innerHTML=`<div class="surface success"><div class="big">✓</div><h2 style="font-size:25px">Application Received</h2><p class="muted">Thank you for applying to ValleyByte. Our team will follow up with enrollment and payment instructions using the contact details you provided.</p><p class="tiny" style="font-family:monospace">Reference: ${ref}</p></div>`;
}catch(networkErr){

async function submitContact(e){
e.preventDefault();let n=cname.value.trim(),em=cemail.value.trim(),m=cmessage.value.trim(),ph=cphone.value.trim(),errors=[];if(!n)errors.push("Name is required.");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))errors.push("Enter a valid email.");if(!m)errors.push("Please add a short message.");
if(errors.length){contactErrors.innerHTML=errors.map(x=>err("",x)).join("");return}
const submitBtn=e.target.querySelector('button[type="submit"]');const originalLabel=submitBtn.textContent;
submitBtn.disabled=true;submitBtn.textContent="Sending...";contactErrors.innerHTML="";
try{
const fd=new FormData();
fd.append("formType","contact");
fd.append("name",n);
fd.append("email",em);
fd.append("phone",ph);
fd.append("message",m);
fd.append("submittedAt",new Date().toISOString());
await fetch(APPS_SCRIPT_URL,{method:"POST",body:fd,mode:"no-cors"});
document.getElementById("contactBox").innerHTML=`<div class="surface success"><div class="big">✓</div><h2 style="font-size:25px">Message Sent</h2><p class="muted">Thanks for reaching out. Our team will get back to you soon.</p><button class="btn secondary" onclick="location.reload()">Send Another Message</button></div>`;
}catch(networkErr){
contactErrors.innerHTML=err("","We couldn't send your message — please check your connection and try again, or email us directly.");
submitBtn.disabled=false;submitBtn.textContent=originalLabel;
}
}
function verifyCert(e){
e.preventDefault();let id=certId.value.trim().toUpperCase(),r=certs[id];verifyResult.innerHTML=r?certCard(r):`<div class="surface success"><div class="big" style="color:var(--danger)">×</div><h2 style="font-size:24px">Certificate Not Found</h2><p class="muted">We couldn't find a certificate matching that ID. Please check the ID and try again.</p></div>`;
}
</script>
