<style>
:root{--bg:#070b12;--bg2:#0b111a;--surface:#0d141e;--line:#1b2633;--text:#eef4f8;--muted:#8b9aaa;--dim:#526171;--cyan:#22d3ee;--cyan2:#06b6d4;--danger:#fb7185;--amber:#fbbf24;--max:1120px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{width:min(var(--max),calc(100% - 40px));margin:auto}.border{border-bottom:1px solid var(--line)}.alt{background:var(--bg2)}
header{position:sticky;top:0;z-index:50;background:rgba(7,11,18,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:750;font-size:19px;letter-spacing:-.02em}.brand-logo{width:36px;height:36px;object-fit:cover;border-radius:8px;display:block;border:1px solid #ffffff10}.brand-name{color:var(--text)}.brand-name .byte{color:var(--cyan)}
.navlinks{display:flex;gap:3px}.navlinks a{padding:9px 11px;border-radius:7px;color:var(--muted);font-size:14px}.navlinks a:hover,.navlinks a.active{color:var(--text);background:#ffffff06}
.actions{display:flex;gap:9px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;padding:10px 15px;border:1px solid var(--line);font-size:14px;font-weight:650;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--cyan);border-color:var(--cyan);color:#031016}.secondary{background:#ffffff03;color:var(--text)}
.mobile{display:none;background:none;border:0;color:var(--text);font-size:24px}.mobile-menu{display:none;padding:10px 0 18px}.mobile-menu a{display:block;padding:12px 4px;color:var(--muted);border-bottom:1px solid #ffffff0a}
section{border-bottom:1px solid var(--line)}.pad{padding:82px 0}.hero{min-height:650px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.eyebrow{font-family:monospace;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--cyan)}h1{font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.045em;margin:15px 0 22px}h2{font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.03em;margin:7px 0 13px}h3{margin:0}.lead{font-size:17px;color:var(--muted);max-width:650px}.hero-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.hero-image{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0b1119;box-shadow:0 30px 100px #0008}.hero-image img{display:block;width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.grid2form{display:grid;grid-template-columns:1fr 1.25fr;gap:55px}
.kicker{color:var(--muted);font-size:15px;max-width:650px}.surface{background:var(--surface);border:1px solid var(--line);border-radius:12px}.card{padding:23px}.card .icon{color:var(--cyan);font-size:22px;margin-bottom:15px}.card p,.body{color:var(--muted);font-size:14px}.feature-grid{margin-top:40px}.feature-card{min-height:180px}.number{font-family:monospace;color:var(--dim);font-size:12px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.tag{display:inline-block;border:1px solid var(--line);background:#ffffff03;color:#b7c3cf;border-radius:999px;padding:5px 10px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.stat{padding:15px}.stat small{display:block;color:var(--dim);font-size:11px}.stat strong{display:block;margin-top:3px;font-size:14px}.list{display:grid;gap:9px}.list-item{display:flex;gap:11px;align-items:center;padding:12px 14px}.check{color:var(--cyan);font-weight:800}
.timeline{display:grid;gap:12px;margin-top:35px}.week{display:grid;grid-template-columns:80px 1fr;gap:20px;padding:20px}.weekno{font-family:monospace;color:var(--cyan);font-size:13px}.week ul{margin:9px 0 0;padding-left:18px;color:var(--muted);font-size:14px}.week li{margin:4px 0}
.cta{padding:70px 0}.cta-box{padding:38px;display:flex;align-items:center;justify-content:space-between;gap:25px}
.notice{display:flex;gap:13px;padding:18px;border:1px solid #fbbf2425;background:#fbbf2408;border-radius:10px;color:var(--muted);font-size:14px}.notice b{color:var(--text)}
form{padding:25px}.field{margin-bottom:17px}.field label{display:block;font-size:12px;color:#b8c3ce;margin-bottom:7px;font-weight:650}.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:#080e16;border:1px solid var(--line);border-radius:7px;color:var(--text);outline:none}.field textarea{resize:vertical;min-height:110px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#22d3ee66;box-shadow:0 0 0 3px #22d3ee0b}.error{color:var(--danger);font-size:12px;margin-top:5px}.success{text-align:center;padding:45px 25px}.success .big{font-size:38px;color:var(--cyan)}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--dim)}
.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.faq{border:1px solid var(--line);border-radius:10px;overflow:hidden}.faq-item+ .faq-item{border-top:1px solid var(--line)}.faq-q{width:100%;padding:17px;background:none;border:0;color:var(--text);display:flex;justify-content:space-between;text-align:left;font-weight:650}.faq-a{display:none;padding:0 17px 18px;color:var(--muted);font-size:14px}.faq-item.open .faq-a{display:block}.faq-item.open .plus{transform:rotate(45deg)}.plus{transition:.2s;font-size:20px;color:var(--dim)}
.cert{padding:28px;background:linear-gradient(135deg,#0d1722,#091018);border:1px solid #244052;border-radius:13px}.cert .seal{font-family:monospace;color:var(--cyan);font-size:11px;letter-spacing:.12em}.cert h3{font-size:25px;margin:15px 0 5px}.cert .line{height:1px;background:var(--line);margin:22px 0}.cert-meta{display:grid;grid-template-columns:1fr 1fr;gap:13px}.cert-meta small{display:block;color:var(--dim);font-size:10px}.cert-meta span{font-size:13px;color:#c6d0d9}.status-valid{color:#67e8f9!important}.status-revoked{color:var(--danger)!important}
.page-head{padding:75px 0 55px}.page-head p{max-width:650px;color:var(--muted)}
footer{padding:45px 0;color:var(--dim);font-size:13px}.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:30px}.footer-links{display:grid;gap:8px}.footer-links a:hover{color:var(--text)}
.hidden{display:none!important}
@media(max-width:950px){.navlinks,.actions{display:none}.mobile{display:block}.mobile-menu.show{display:block}.hero{grid-template-columns:1fr;padding:55px 0}.grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.grid2,.grid2form{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.container{width:min(100% - 28px,var(--max))}.pad{padding:58px 0}.grid3,.grid4,.stat-grid,.two-fields{grid-template-columns:1fr}h1{font-size:44px}.cta-box{display:block}.cta-box .actions{display:flex;margin-top:20px}.week{grid-template-columns:1fr;gap:5px}.cert-meta{grid-template-columns:1fr}.hero{min-height:auto}}

/* ========================= VISUAL MOTION SYSTEM ========================= */
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-5;pointer-events:none;background:radial-gradient(circle at 12% 18%,rgba(34,211,238,.09),transparent 28%),radial-gradient(circle at 84% 30%,rgba(59,130,246,.08),transparent 30%),radial-gradient(circle at 55% 90%,rgba(6,182,212,.06),transparent 32%),var(--bg)}
.motion-bg{position:fixed;inset:0;z-index:-4;pointer-events:none;overflow:hidden;opacity:.9}
.motion-bg .grid{transform:translate3d(var(--mx,0),var(--my,0),0);position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:58px 58px;mask-image:radial-gradient(circle at center,black 20%,transparent 78%);animation:gridDrift 24s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(.2px);mix-blend-mode:screen}
.orb.a{width:360px;height:360px;left:-120px;top:12%;background:radial-gradient(circle,rgba(34,211,238,.15),transparent 68%);animation:floatA 16s ease-in-out infinite}
.orb.b{width:430px;height:430px;right:-170px;top:34%;background:radial-gradient(circle,rgba(59,130,246,.13),transparent 68%);animation:floatB 20s ease-in-out infinite}
.orb.c{width:280px;height:280px;left:42%;bottom:-120px;background:radial-gradient(circle,rgba(6,182,212,.11),transparent 68%);animation:floatC 18s ease-in-out infinite}
.motion-ring{position:absolute;border:1px solid rgba(34,211,238,.12);border-radius:50%;transform-origin:center;}
.motion-ring.r1{width:520px;height:210px;left:58%;top:8%;transform:rotate(-22deg);animation:orbit 25s linear infinite}
.motion-ring.r2{width:690px;height:260px;left:34%;top:48%;transform:rotate(25deg);border-color:rgba(59,130,246,.09);animation:orbitReverse 32s linear infinite}
.motion-ring.r3{width:340px;height:340px;left:8%;top:58%;border-color:rgba(34,211,238,.07);animation:pulseRing 9s ease-in-out infinite}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#dffaff;box-shadow:0 0 14px rgba(34,211,238,.9);animation:particleFloat 8s ease-in-out infinite}
.p1{left:12%;top:26%;animation-delay:-1s}.p2{left:22%;top:72%;animation-delay:-4s}.p3{left:71%;top:18%;animation-delay:-2s}.p4{left:87%;top:65%;animation-delay:-6s}.p5{left:54%;top:8%;animation-delay:-3s}.p6{left:47%;top:82%;animation-delay:-5s}.p7{left:78%;top:88%;animation-delay:-7s}.p8{left:34%;top:35%;animation-delay:-2.5s}
section,.cta{position:relative}
.hero{position:relative}
.hero::after{content:"";position:absolute;inset:-80px -100px auto auto;width:480px;height:480px;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.09),transparent 68%);filter:blur(8px);animation:heroGlow 7s ease-in-out infinite}
.surface{box-shadow:0 18px 70px rgba(0,0,0,.12);transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}.surface:hover{border-color:rgba(34,211,238,.22);box-shadow:0 24px 90px rgba(0,0,0,.2)}
.feature-card:hover{transform:translateY(-5px)}
@keyframes gridDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(58px,58px,0)}}
@keyframes floatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,45px) scale(1.12)}}
@keyframes floatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-55px) scale(1.08)}}
@keyframes floatC{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-65px)}}
@keyframes orbit{from{transform:rotate(-22deg) rotate(0deg)}to{transform:rotate(-22deg) rotate(360deg)}}
@keyframes orbitReverse{from{transform:rotate(25deg) rotate(360deg)}to{transform:rotate(25deg) rotate(0deg)}}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.09);opacity:1}}
@keyframes particleFloat{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-28px);opacity:1}}
@keyframes heroGlow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
@media(prefers-reduced-motion:reduce){.motion-bg *,.hero::after,.surface{animation:none!important;transition:none!important}}

</style>

<section><div class="container pad grid2"><div><div class="eyebrow">Who We Are</div><h2>Practical by design</h2><p class="body">ValleyByte is a practical technology learning platform built for students, fresh graduates, and career changers based in Nepal, with an architecture designed to expand into new regions and programs over time. We focus on one thing: turning academic knowledge into demonstrable, real-world skill.</p></div><div><div class="eyebrow">Our Mission</div><h2>Bridge learning and industry</h2><p class="body">To help aspiring technology professionals bridge the gap between academic learning and industry expectations through practical, structured, and measurable experience.</p></div></div></section>
<section class="alt"><div class="container pad grid2"><div><div class="eyebrow">Our Approach</div><h2>Work, feedback, evaluation</h2><p class="body">Every program is built around structured tasks, real project work, mentor feedback, and performance-based evaluation — rather than passive video lessons. Participants complete work that mirrors actual industry workflows, and are assessed on what they actually produce.</p></div><div><div class="eyebrow">Why Practical Experience Matters</div><h2>Show what you can do</h2><p class="body">Theoretical knowledge alone rarely demonstrates job readiness. Practical, evaluated project work gives students and fresh graduates concrete material — test cases, bug reports, code, documentation — that they can show, discuss, and build on.</p></div></div></section>
<section><div class="container pad grid2"><div><div class="eyebrow">Founder & CEO</div><h2>Prayojan Ghimire</h2><p class="body">Founder & CEO, ValleyByte.</p></div><div class="hero-image"><img src="${ceoImage}" alt="Prayojan Ghimire"></div></div></section>`}

function whyPage(){return `<section><div class="container pad">${heading("Why ValleyByte","Education gives you knowledge. Experience gives it value.","ValleyByte exists for the space between studying a subject and being ready to use it professionally. We work with students who are already studying at a university, college, or through a course and give them a structured path to turn that knowledge into practical career evidence.")}<div class="grid3 feature-grid"><article class="surface card feature-card"><div class="eyebrow">01 · Learn</div><h3>Build on what you're already studying</h3><p>We don't replace university or formal education. We complement it with focused technical training and industry-style practice.</p></article><article class="surface card feature-card"><div class="eyebrow">02 · Practice</div><h3>Work like the industry</h3><p>Students work through structured tasks, projects, documentation, tools, and workflows that mirror professional environments.</p></article><article class="surface card feature-card"><div class="eyebrow">03 · Prove</div><h3>Create evidence of ability</h3><p>Instead of leaving with only a completion claim, participants build tangible work they can discuss in interviews and present in a portfolio.</p></article></div></div></section>
<section class="alt"><div class="container pad"><div class="eyebrow">What We Provide</div><h2>A bridge from classroom to career</h2><div class="grid4 feature-grid">${[["Professional Training","Focused learning designed around the skills students need to apply their academic knowledge."],["Onsite Opportunities","Where available, gain experience in an onsite environment with professional expectations."],["Remote Internships","Structured remote internship experiences for students who cannot work onsite."],["Career-Focused Projects","Complete practical projects that create evidence you can carry into your CV and portfolio."]].map((x,i)=>`<article class="surface card feature-card"><div class="number">0${i+1}</div><div class="icon">${["◈","⌂","↗","◆"][i]}</div><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</div></div></section>
<section><div class="container pad grid2"><div><div class="eyebrow">The ValleyByte Model</div><h2>Study → Train → Work → Get Evaluated → Move Forward</h2><p class="kicker">The goal is not to collect another line on a CV. The goal is to make the line defensible.</p></div><div class="timeline"><div class="surface week"><div class="weekno">01</div><div><strong>Choose a path</strong><p class="body">Select training or an internship aligned with what you're studying and where you want to go.</p></div></div><div class="surface week"><div class="weekno">02</div><div><strong>Build practical skill</strong><p class="body">Learn through tasks, tools, mentor guidance, and project work.</p></div></div><div class="surface week"><div class="weekno">03</div><div><strong>Produce evidence</strong><p class="body">Create work products that demonstrate what you can actually do.</p></div></div><div class="surface week"><div class="weekno">04</div><div><strong>Move forward</strong><p class="body">Use the experience, feedback, portfolio material, and verified outcomes in your next career step.</p></div></div></div></div></section>`}
function programs(){return `<section><div class="container pad">${heading("Programs","Practical programs built around real work","Choose a current program or explore what's coming next.")}<div class="grid3 feature-grid"><article class="surface card"><div class="eyebrow">Available</div><h3 style="margin-top:10px">${qa.name}</h3><p>${qa.description}</p><div class="stat-grid" style="grid-template-columns:1fr 1fr">${[["Duration",qa.duration],["Fee",qa.fee]].map(s=>`<div class="surface stat"><small>${s[0]}</small><strong>${s[1]}</strong></div>`).join("")}</div><div class="hero-buttons">${btn("#/programs/qa-software-testing","View Program",true)}</div></article>${future.map(x=>`<article class="surface card"><div class="eyebrow">Coming Soon</div><h3 style="margin-top:10px">${x[1]}</h3><p>${x[2]}</p><span class="tag">TBA</span></article>`).join("")}</div></div></section>`}

<section class="alt"><div class="container pad"><div class="eyebrow">Weekly Curriculum</div><h2>A four-week testing workflow</h2>${timeline()}</div></section>
<section><div class="container pad grid2"><div><div class="eyebrow">Evaluation</div><h2>How your work is evaluated</h2><p class="body">Mentors review the test cases, bug reports, API tests, and automation scripts you submit throughout the program against defined evaluation criteria, and provide structured feedback at each stage.</p></div><div><div class="eyebrow">Certification</div><h2>Earning your certificate</h2><p class="body">Participants who meet the completion and evaluation requirements receive a certificate with a unique certificate ID and QR code that employers can verify online.</p><div class="notice" style="margin-top:18px">⚠ <span>Completion of the program does not automatically result in certification.</span></div></div></div></section>
<section class="alt"><div class="container pad"><h2>What you'll walk away with</h2><div class="grid3 feature-grid">${qa.outcomes.map(x=>`<div class="surface list-item"><span class="check">✓</span><span>${x}</span></div>`).join("")}</div></div></section>
<section><div class="container pad"><div class="eyebrow">FAQ</div><h2>Common questions about this program</h2><div style="max-width:760px;margin-top:30px">${faq()}</div></div></section>
<section class="alt cta"><div class="container"><div class="surface cta-box"><div><h2>Apply for the QA Internship</h2><p class="muted">Spaces are limited each cycle. Start your application today.</p></div><div class="actions">${btn("#/apply/qa-software-testing","Apply",true)}${btn("#/faq","Read the FAQ")}</div></div></div></section>`}

function apply(){return `<section><div class="container pad">${heading("Application & Enrollment",qa.name)}<div class="grid2form"><div><div class="stat-grid" style="grid-template-columns:1fr">${[["Duration",qa.duration],["Mode",qa.mode],["Fee",qa.fee]].map(s=>`<div class="surface stat"><small>${s[0]}</small><strong>${s[1]}</strong></div>`).join("")}</div><p class="body">Submitting this form starts your application. It does not enroll you automatically — our team will follow up with enrollment and payment instructions using the contact details you provide.</p></div><div id="applicationBox">${applicationForm()}</div></div></div></section>`}

function contact(){return `<section><div class="container pad">${heading("Contact","Have a question?","Send us a message and we'll show a confirmation immediately. Messages are submitted through Web3Forms.")}<div class="grid2form"><div><div class="surface card"><div class="eyebrow">Contact</div><h3 style="margin-top:10px">ValleyByte</h3><p class="body">For program questions, application support, or general enquiries, use the form.</p><div class="tags"><span class="tag">Nepal</span><span class="tag">Remote Programs</span></div></div></div><div id="contactBox">${contactForm()}</div></div></div></section>`}
function contactForm(){return `<form id="contactForm" onsubmit="submitContact(event)"><div class="field"><label>NAME</label><input id="cname"></div><div class="two-fields"><div class="field"><label>EMAIL</label><input id="cemail" type="email"></div><div class="field"><label>PHONE (OPTIONAL)</label><input id="cphone"></div></div><div class="field"><label>MESSAGE</label><textarea id="cmessage"></textarea></div><div id="contactErrors"></div><button class="btn primary" type="submit">Send Message</button></form>`}

function verify(){return `<section><div class="container pad">${heading("Certificate Verification","Verify a ValleyByte certificate","Enter a certificate ID to confirm whether it was issued by ValleyByte.")}<form onsubmit="verifyCert(event)" style="padding:0;max-width:650px;background:none;border:0"><div class="hero-buttons" style="margin-top:0"><input id="certId" placeholder="e.g. VB-QA-2026-000001" style="flex:1;padding:11px;background:#080e16;border:1px solid var(--line);border-radius:7px;color:var(--text);text-transform:uppercase"><button class="btn primary" type="submit">⌕ Verify</button></div></form><p class="tiny">Demo data — try VB-QA-2026-000001 or VB-QA-2026-000002.</p><div id="verifyResult" style="max-width:650px;margin-top:30px"></div></div></section>`}

function faqPage(){return `<section><div class="container pad">${heading("FAQ","Frequently asked questions","Everything you need to know about ValleyByte programs and certification.")}<div style="max-width:800px">${faq()}</div></div></section>`}
function privacy(){return `<section><div class="container pad">${heading("Legal","Privacy Policy")}<div class="body"><h3>Information We Collect</h3><p>When you apply or contact us, information such as your name, email, phone, education details and message may be provided. Application and contact information is transmitted to Web3Forms so that it can be delivered to the configured recipient.</p><h3>Certificate Verification</h3><p>The public verification tool displays only certificate ID, program, participant name, issue date and status. Grades, mentor feedback, task details and personal contact information are not displayed.</p><h3>Data Sharing</h3><p>We do not sell personal information. This website uses Web3Forms to process form submissions.</p><h3>Contact</h3><p>Questions about this policy can be directed to the contact page.</p></div></div></section>`}
function terms(){return `<section><div class="container pad">${heading("Legal","Terms & Conditions")}<div class="body"><p>Last updated: to be configured. This placeholder outlines general terms for using the ValleyByte website and applying to ValleyByte programs.</p><h3>Program Enrollment</h3><p>Submitting an application does not automatically enroll you. Enrollment and payment instructions are provided separately after an application is reviewed.</p><h3>Certification</h3><p>Payment provides access to program materials and mentorship. It does not guarantee that a certificate will be issued. Certificates are issued only to participants who meet applicable completion and evaluation requirements.</p><h3>No Guarantee of Employment</h3><p>ValleyByte does not guarantee employment, a specific salary, or any particular career outcome.</p><h3>Acceptable Use</h3><p>You agree to provide accurate information and not to misuse the certificate verification tool or other parts of the website.</p></div></div></section>`}

function render(){
let path=location.hash.slice(1)||"/";
if(path.endsWith("/"))path=path.slice(0,-1)||"/";
let content=path==="/" ? home() :
path==="/about"?about():
path==="/programs"?programs():
path==="/programs/qa-software-testing"?qaPage():
path==="/how-it-works"?how():
path==="/faq"?faqPage():
path==="/contact"?contact():
path==="/why-valleybyte"?whyPage():
path==="/verify-certificate"?verify():
path==="/apply/qa-software-testing"?apply():
path==="/privacy"?privacy():
path==="/terms"?terms():
`<section><div class="container pad" style="text-align:center">${heading("404","Page not found","The page you're looking for doesn't exist or may have moved.")}${btn("#/","← Back to Home",true)}</div></section>`;
document.getElementById("app").innerHTML=content;
document.querySelectorAll(".navlinks a,.mobile-menu a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===`#${path}`));
window.scrollTo(0,0);
document.getElementById("mobileMenu").classList.remove("show");
}
const nav=[["Home","/"],["About","/about"],["Programs","/programs"],["How It Works","/how-it-works"],["Why ValleyByte","/why-valleybyte"],["FAQ","/faq"],["Contact","/contact"]];
document.getElementById("desktopNav").innerHTML=nav.map(x=>`<a href="#${x[1]}">${x[0]}</a>`).join("");
document.getElementById("mobileMenu").innerHTML=nav.map(x=>`<a href="#${x[1]}">${x[0]}</a>`).join("")+`<a href="#/verify-certificate">Verify Certificate</a><a href="#/apply/qa-software-testing">Apply Now</a>`;
document.getElementById("mobileBtn").onclick=()=>document.getElementById("mobileMenu").classList.toggle("show");
window.addEventListener("hashchange",render);render();
window.addEventListener("pointermove",e=>{
  const x=(e.clientX/window.innerWidth-.5), y=(e.clientY/window.innerHeight-.5);
  document.documentElement.style.setProperty("--mx",(x*18).toFixed(2)+"px");
  document.documentElement.style.setProperty("--my",(y*18).toFixed(2)+"px");
  document.querySelectorAll(".motion-ring").forEach((el,i)=>{const d=(i+1)*.35;el.style.marginLeft=(x*d*10).toFixed(1)+"px";el.style.marginTop=(y*d*10).toFixed(1)+"px";});
});


function toggleFaq(i){document.querySelectorAll(".faq-item")[i]?.classList.toggle("open")}
function err(id,msg){return `<div class="error">${msg}</div>`}
const WEB3FORMS_ACCESS_KEY="f3a13108-41d5-45b2-9e81-0cf075dbcca2";
const WEB3FORMS_ENDPOINT="https://api.web3forms.com/submit";

async function submitApplication(e){
e.preventDefault();

const form=e.target;
const vals={
  fullName:form.querySelector('#fullName').value.trim(),
  email:form.querySelector('#email').value.trim(),
  phone:form.querySelector('#phone').value.trim(),
  college:form.querySelector('#college').value.trim(),
  degree:form.querySelector('#degree').value.trim(),
  graduationYear:form.querySelector('#graduationYear').value.trim(),
  skillLevel:form.querySelector('#skillLevel').value,
  motivation:form.querySelector('#motivation').value.trim()
};

const errors=[];
if(!vals.fullName)errors.push("Full name is required.");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(vals.email))errors.push("Enter a valid email.");
if(!vals.phone)errors.push("Phone number is required.");
if(!vals.college)errors.push("College or university is required.");
if(!vals.degree)errors.push("Degree is required.");
if(!/^\d{4}$/.test(vals.graduationYear))errors.push("Enter a valid 4-digit graduation year.");
if(!vals.skillLevel)errors.push("Please select your current skill level.");
if(vals.motivation.length<20)errors.push("Please share at least a couple of sentences.");

const appErrors=form.querySelector('#appErrors');
if(errors.length){
  appErrors.innerHTML=errors.map(x=>err("",x)).join("");
  return;
}

const ref=`VB-APP-${new Date().getFullYear()}-${Math.floor(100000+Math.random()*900000)}`;
const submitBtn=form.querySelector('button[type="submit"]');
const originalLabel=submitBtn.textContent;
submitBtn.disabled=true;
submitBtn.textContent="Submitting...";
appErrors.innerHTML="";

try{
  const payload={
    access_key:WEB3FORMS_ACCESS_KEY,
    subject:"New ValleyByte QA Internship Application",
    from_name:"ValleyByte Website",
    form_type:"QA Internship Application",
    reference_id:ref,
    full_name:vals.fullName,
    email:vals.email,
    phone:vals.phone,
    college_university:vals.college,
    degree:vals.degree,
    graduation_year:vals.graduationYear,
    current_skill_level:vals.skillLevel,
    why_do_you_want_to_join:vals.motivation,
    submitted_at:new Date().toISOString()
  };

  const response=await fetch(WEB3FORMS_ENDPOINT,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Accept":"application/json"
    },
    body:JSON.stringify(payload)
  });

  const data=await response.json();

  if(!response.ok||!data.success){
    throw new Error(data.message||"Web3Forms submission failed");
  }

  document.getElementById("applicationBox").innerHTML=`<div class="surface success"><div class="big">✓</div><h2 style="font-size:25px">Application Received</h2><p class="muted">Thank you for applying to ValleyByte. Your application has been sent successfully.</p><p class="tiny" style="font-family:monospace">Reference: ${ref}</p></div>`;

}catch(error){
  console.error("Web3Forms application submission failed:",error);
  submitBtn.disabled=false;
  submitBtn.textContent=originalLabel;
  appErrors.innerHTML=err("",error.message||"Could not submit the application. Please try again.");
}
}

async function submitContact(e){
e.preventDefault();
let n=cname.value.trim(),em=cemail.value.trim(),m=cmessage.value.trim(),ph=cphone.value.trim(),errors=[];
if(!n)errors.push("Name is required.");
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))errors.push("Enter a valid email.");
if(!m)errors.push("Please add a short message.");
if(errors.length){contactErrors.innerHTML=errors.map(x=>err("",x)).join("");return}

const submitBtn=e.target.querySelector('button[type="submit"]');
const originalLabel=submitBtn.textContent;
submitBtn.disabled=true;
submitBtn.textContent="Sending...";
contactErrors.innerHTML="";

try{
const formData=new FormData();
formData.append("access_key",WEB3FORMS_ACCESS_KEY);
formData.append("subject","New ValleyByte Contact Message");
formData.append("from_name","ValleyByte Website");
formData.append("form_type","Contact Message");
formData.append("name",n);
formData.append("email",em);
formData.append("phone",ph);
formData.append("message",m);
formData.append("submitted_at",new Date().toISOString());

const response=await fetch(WEB3FORMS_ENDPOINT,{method:"POST",body:formData});
const data=await response.json();
if(!response.ok||!data.success)throw new Error(data.message||"Web3Forms submission failed");

document.getElementById("contactBox").innerHTML=`<div class="surface success"><div class="big">✓</div><h2 style="font-size:25px">Message Sent</h2><p class="muted">Thanks for reaching out. Your message has been sent successfully.</p><button class="btn secondary" onclick="location.reload()">Send Another Message</button></div>`;
}catch(error){
console.error("Web3Forms contact submission failed:",error);
submitBtn.disabled=false;
submitBtn.textContent=originalLabel;
contactErrors.innerHTML=err("",error.message||"Could not send your message. Please try again.");
}
}
function verifyCert(e){
e.preventDefault();let id=certId.value.trim().toUpperCase(),r=certs[id];verifyResult.innerHTML=r?certCard(r):`<div class="surface success"><div class="big" style="color:var(--danger)">×</div><h2 style="font-size:24px">Certificate Not Found</h2><p class="muted">We couldn't find a certificate matching that ID. Please check the ID and try again.</p></div>`;
}
</script>
